add_task:
  fields:
    title:
      required: true
      example: Milch
      selector:
        text:
    target:
      required: true
      example: Supermarkt
      selector:
        text:
    type:
      default: kaufen
      selector:
        select:
          options:
            - kaufen
            - abholen
            - bringen
            - zurueckgeben
            - erledigen
            - aufraeumen

tasks_at:
